[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"
[project]
name = "taskflow-hd"
version = "1.0.0"
description = "TaskFlow: a monitored task-management service"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1.2,<4", "gunicorn>=26.2,<27", "prometheus-client>=0.22,<1"]
[tool.setuptools.package-data]
taskflow = ["templates/*.html"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
[tool.coverage.run]
source = ["taskflow"]
branch = true
[tool.coverage.report]
fail_under = 90
show_missing = true
[tool.setuptools.packages.find]
include = ["taskflow*"]
