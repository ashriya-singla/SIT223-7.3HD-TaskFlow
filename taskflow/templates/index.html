<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow</title><style>
body{font:16px system-ui;background:#edf2f7;color:#17324b;margin:0}main{max-width:1040px;margin:60px auto;padding:24px}h1{font-size:42px;margin-bottom:8px}.muted{color:#617589}.card{background:white;border-radius:18px;padding:24px;margin:24px 0;box-shadow:0 10px 40px #17324b0c}input,select,button{font:inherit;padding:12px;border:1px solid #ccd7e1;border-radius:8px;margin:4px}button{background:#125c60;color:white;cursor:pointer}input{max-width:90%}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.task{padding:16px 0;border-bottom:1px solid #edf2f7}.title{flex:1;min-width:220px}.pill{background:#e0f1ed;padding:7px 12px;border-radius:30px}#error{color:#a12237}footer{font-size:13px;color:#617589}
</style></head><body><main><div class="pill" style="display:inline-block">WORKSPACE / {{ env }}</div><h1>Make room for what matters.</h1><p class="muted">TaskFlow keeps your priorities moving, from idea to done.</p><section id="login" class="card"><h2>Welcome back</h2><form id="signin"><input id="password" type="password" placeholder="Workspace password" required autocomplete="current-password"><button>Sign in</button></form></section><section id="workspace" hidden><div class="card"><div id="summary" class="row"></div></div><div class="card"><h2>A clear next step</h2><form id="create" class="row"><input id="title" maxlength="120" placeholder="What needs to happen?" required><select id="priority"><option>medium</option><option>high</option><option>low</option></select><button>Add task</button></form></div><div class="card"><div class="row"><h2 class="title">Your tasks</h2><input id="search" placeholder="Search tasks" aria-label="Search tasks"><button id="logout">Sign out</button></div><div id="tasks"></div></div></section><p id="error" role="alert"></p><footer>TaskFlow · Release {{ version }} · {{ env }} environment</footer></main><script>
let csrf='';const el=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf}});const data=r.status===204?{}:await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data;}
async function refresh(){try{const data=await api('/api/tasks?q='+encodeURIComponent(el('search').value));el('tasks').replaceChildren();for(const t of data.tasks){const row=document.createElement('div');row.className='row task';const title=document.createElement('span');title.className='title';title.textContent=t.title+' · '+t.priority;const state=document.createElement('select');for(const s of ['todo','doing','done']){const o=new Option(s,s);o.selected=s===t.status;state.add(o);}state.onchange=()=>run(async()=>{await api('/api/tasks/'+t.id,{method:'PATCH',body:JSON.stringify({status:state.value})});await refresh();});const remove=document.createElement('button');remove.textContent='Delete';remove.onclick=()=>run(async()=>{await api('/api/tasks/'+t.id,{method:'DELETE'});await refresh();});row.append(title,state,remove);el('tasks').append(row);}const stats=await api('/api/summary');el('summary').replaceChildren();for(const [k,v] of Object.entries(stats)){const s=document.createElement('span');s.className='pill';s.textContent=k+' · '+v;el('summary').append(s);}}catch(e){el('error').textContent=e.message;}}
async function run(fn){el('error').textContent='';try{await fn();}catch(e){el('error').textContent=e.message;}}
el('signin').onsubmit=e=>{e.preventDefault();run(async()=>{csrf=(await api('/login',{method:'POST',body:JSON.stringify({password:el('password').value})})).csrf;el('password').value='';el('login').hidden=true;el('workspace').hidden=false;await refresh();});};
el('create').onsubmit=e=>{e.preventDefault();run(async()=>{await api('/api/tasks',{method:'POST',body:JSON.stringify({title:el('title').value,priority:el('priority').value})});el('title').value='';await refresh();});};el('search').oninput=refresh;el('logout').onclick=()=>run(async()=>{await api('/api/logout',{method:'POST'});el('workspace').hidden=true;el('login').hidden=false;csrf='';});
</script></body></html>
